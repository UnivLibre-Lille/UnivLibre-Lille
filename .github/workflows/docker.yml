name: Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build-and-test:
    name: Build and smoke test image
    runs-on: ubuntu-latest
    env:
      IMAGE: univlibre-site:ci
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Validate nginx config
        run: docker run --rm "$IMAGE" nginx -t

      - name: Start container
        # Short health interval so the Dockerfile HEALTHCHECK is exercised quickly
        run: docker run -d --name site -p 8080:80 --health-interval=2s "$IMAGE"

      - name: Wait for container to be healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' site)
            echo "Health status: $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done
          echo "Container did not become healthy"
          docker inspect -f '{{json .State.Health}}' site
          exit 1

      - name: Smoke test
        run: |
          set -e
          # Home page is served
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)
          [ "$code" = "200" ] || { echo "GET / returned $code"; exit 1; }

          # Unknown page returns 404
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/does-not-exist)
          [ "$code" = "404" ] || { echo "GET /does-not-exist returned $code"; exit 1; }

          echo "Smoke tests passed"

      - name: Container logs
        if: always()
        run: docker logs site || true

      - name: Cleanup
        if: always()
        run: docker rm -f site || true
