name: Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build-and-test:
    name: Build and test image
    runs-on: ubuntu-latest
    env:
      IMAGE: univlibre-lille:ci
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Validate NGINX config
        run: docker run --rm "$IMAGE" nginx -t

      - name: Start container
        run: docker run -d --name univlibre-lille -p 8080:80 "$IMAGE"

      - name: Wait for container to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "Website is up"
              exit 0
            fi
            sleep 1
          done
          docker logs univlibre-lille
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f univlibre-lille || true
